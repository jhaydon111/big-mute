<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Big Mute</title>
  <style>
    :root { color-scheme: dark; --accent: #F7C449; }
    body { margin: 0; background: #151515; color: #ddd; font: 14px -apple-system, Helvetica, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; padding: 10px 14px; background: #222; border-bottom: 1px solid #333; color: #888; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    #track { font: 600 22px -apple-system, Helvetica, sans-serif; color: #ccc; }
    #mute { width: min(60vw, 60vh); height: min(60vw, 60vh); border-radius: 50%; border: 4px solid #444; background: #2a2a2a; color: #ddd; cursor: pointer; font: 800 clamp(28px, 8vmin, 72px) -apple-system, Helvetica, sans-serif; letter-spacing: 0.05em; transition: background 0.08s, transform 0.05s; }
    #mute:hover:not(:disabled) { border-color: var(--accent); }
    #mute:active:not(:disabled) { transform: scale(0.97); }
    #mute.on { background: var(--accent); color: #000; border-color: var(--accent); }
    #mute:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>
  <header><span>Big Mute</span><span id="status">connecting...</span></header>
  <main>
    <div id="track">No track</div>
    <button id="mute" disabled><span class="label">MUTE</span></button>
  </main>
  <script src="vendor/luna.global.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
